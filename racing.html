<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>4 Player Car Racing</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  touch-action:none;
}

body{
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:#4d9b3a;
}

/* ROAD */
#road{
  position:absolute;
  width:58%;
  height:100%;
  left:21%;
  background:#333;
  border-left:8px solid white;
  border-right:8px solid white;
}

.lane{
  position:absolute;
  width:6px;
  height:70px;
  background:white;
  left:50%;
  transform:translateX(-50%);
  opacity:.8;
}

/* FINISH */
#finish{
  position:absolute;
  top:80px;
  left:21%;
  width:58%;
  height:35px;
  background:
    repeating-linear-gradient(
      90deg,
      white 0 25px,
      black 25px 50px
    );
  border:3px solid white;
  z-index:5;
}

/* CARS */
.car{
  position:absolute;
  width:42px;
  height:72px;
  border-radius:10px;
  border:3px solid white;
  z-index:10;
  box-shadow:0 3px 8px #000;
}

.car:before{
  content:"";
  position:absolute;
  top:10px;
  left:6px;
  width:24px;
  height:17px;
  background:#8ee8ff;
  border-radius:5px;
}

#car1{background:#e53935;}
#car2{background:#1976d2;}
#car3{background:#fbc02d;}
#car4{background:#9c27b0;}

/* PLAYER NAMES */
.name{
  position:absolute;
  color:white;
  font-size:11px;
  font-weight:bold;
  z-index:20;
  text-shadow:1px 1px 2px black;
}

/* JOYSTICKS */
.joy{
  position:absolute;
  width:115px;
  height:115px;
  border-radius:50%;
  background:rgba(255,255,255,.15);
  border:3px solid rgba(255,255,255,.5);
  z-index:50;
}

.stick{
  position:absolute;
  width:48px;
  height:48px;
  border-radius:50%;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:rgba(255,255,255,.75);
  border:3px solid #222;
}

#joy1{left:15px;bottom:15px;}
#joy2{right:15px;bottom:15px;}
#joy3{left:15px;top:15px;}
#joy4{right:15px;top:15px;}

/* INFO */
#info{
  position:absolute;
  top:8px;
  left:50%;
  transform:translateX(-50%);
  z-index:100;
  color:white;
  background:rgba(0,0,0,.7);
  padding:7px 15px;
  border-radius:20px;
  font-weight:bold;
  text-align:center;
}

/* WIN SCREEN */
#win{
  display:none;
  position:absolute;
  inset:0;
  z-index:200;
  background:rgba(0,0,0,.85);
  color:white;
  text-align:center;
  padding-top:30vh;
}

#win h1{
  font-size:42px;
  color:#ffd600;
  margin-bottom:15px;
}

#next{
  margin-top:20px;
  padding:14px 28px;
  border:0;
  border-radius:10px;
  background:#00c853;
  color:white;
  font-size:20px;
  font-weight:bold;
}
</style>
</head>

<body>

<div id="game">

  <div id="road"></div>
  <div id="finish"></div>

  <div id="info">
    LEVEL <span id="level">1</span> |
    🏁 FIRST TO FINISH WINS
  </div>

  <div id="car1" class="car"></div>
  <div id="car2" class="car"></div>
  <div id="car3" class="car"></div>
  <div id="car4" class="car"></div>

  <div id="name1" class="name">P1</div>
  <div id="name2" class="name">P2</div>
  <div id="name3" class="name">P3</div>
  <div id="name4" class="name">P4</div>

  <!-- FOUR JOYSTICKS -->
  <div class="joy" id="joy1">
    <div class="stick"></div>
  </div>

  <div class="joy" id="joy2">
    <div class="stick"></div>
  </div>

  <div class="joy" id="joy3">
    <div class="stick"></div>
  </div>

  <div class="joy" id="joy4">
    <div class="stick"></div>
  </div>

  <!-- WIN -->
  <div id="win">
    <h1 id="winner">🏆 PLAYER 1 WINS!</h1>
    <p>Congratulations!</p>
    <button id="next">NEXT LEVEL ▶</button>
  </div>

</div>

<script>

const game = document.getElementById("game");
const levelText = document.getElementById("level");

let level = 1;
let finished = false;

const cars = [
  document.getElementById("car1"),
  document.getElementById("car2"),
  document.getElementById("car3"),
  document.getElementById("car4")
];

const names = [
  document.getElementById("name1"),
  document.getElementById("name2"),
  document.getElementById("name3"),
  document.getElementById("name4")
];

const positions = [
  {x:25,y:75},
  {x:40,y:75},
  {x:55,y:75},
  {x:70,y:75}
];

let controls = [
  {x:0,y:0},
  {x:0,y:0},
  {x:0,y:0},
  {x:0,y:0}
];

let speed = 2.2;

function resetCars(){

  finished=false;

  positions.forEach((p,i)=>{
    p.y = 75;

    cars[i].style.left = p.x + "%";
    cars[i].style.top = p.y + "%";

    names[i].style.left = `calc(${p.x}% + 2px)`;
    names[i].style.top = `calc(${p.y}% - 15px)`;
  });

  document.getElementById("win").style.display="none";
}

resetCars();


/* JOYSTICK CONTROL */

function setupJoystick(index){

  const joy=document.getElementById("joy"+(index+1));
  const stick=joy.querySelector(".stick");

  let active=false;

  function move(e){

    if(!active) return;

    const rect=joy.getBoundingClientRect();

    let x=e.clientX-rect.left-rect.width/2;
    let y=e.clientY-rect.top-rect.height/2;

    const max=35;

    let distance=Math.sqrt(x*x+y*y);

    if(distance>max){
      x=x/distance*max;
      y=y/distance*max;
    }

    stick.style.transform=
      `translate(calc(-50% + ${x}px),calc(-50% + ${y}px))`;

    controls[index].x=x/max;
    controls[index].y=y/max;
  }

  joy.addEventListener("pointerdown",e=>{
    active=true;
    joy.setPointerCapture(e.pointerId);
    move(e);
  });

  joy.addEventListener("pointermove",move);

  function stop(){
    active=false;

    stick.style.transform=
      "translate(-50%,-50%)";

    controls[index].x=0;
    controls[index].y=0;
  }

  joy.addEventListener("pointerup",stop);
  joy.addEventListener("pointercancel",stop);
}

for(let i=0;i<4;i++){
  setupJoystick(i);
}


/* GAME LOOP */

function gameLoop(){

  if(!finished){

    for(let i=0;i<4;i++){

      let p=positions[i];
      let c=controls[i];

      /* LEFT / RIGHT */
      p.x += c.x * 0.35;

      /* FORWARD / BACKWARD */
      p.y += c.y * 0.45;

      /* Road boundaries */
      if(p.x < 22) p.x=22;
      if(p.x > 76) p.x=76;

      /* Vertical boundaries */
      if(p.y < 2) p.y=2;
      if(p.y > 90) p.y=90;

      cars[i].style.left=p.x+"%";
      cars[i].style.top=p.y+"%";

      names[i].style.left=`calc(${p.x}% + 2px)`;
      names[i].style.top=`calc(${p.y}% - 15px)`;

      /*
        Finish line is near the top.
        A player wins when their car reaches it.
      */
      if(p.y <= 7){

        finished=true;

        document.getElementById("winner").innerText=
          "🏆 PLAYER "+(i+1)+" WINS!";

        document.getElementById("win").style.display="block";
      }
    }
  }

  requestAnimationFrame(gameLoop);
}

gameLoop();


/* NEXT LEVEL */

document.getElementById("next").addEventListener("click",()=>{

  if(level<100){

    level++;

    levelText.innerText=level;

    /*
      Higher levels can be made harder
      by increasing movement speed.
    */
    speed=2.2 + level*0.03;

    resetCars();

  }else{

    document.getElementById("winner").innerText=
      "🏆 YOU COMPLETED ALL 100 LEVELS!";

    document.getElementById("next").style.display="none";
  }

});

</script>

</body>
</html>
